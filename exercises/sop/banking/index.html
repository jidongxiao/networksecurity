<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Banking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 420px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #183153;
            margin-top: 0;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #185abd;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #12458f;
        }

        .notice {
            margin-top: 25px;
            padding: 12px;
            background: #eef4fb;
            border-left: 4px solid #185abd;
            font-size: 13px;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Online Banking</h1>

    <p>
        Welcome to the online banking system.
        Please sign in to access your account.
    </p>

    <form method="POST" action="/login">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign In</button>

    </form>

    <div class="notice">
        <strong>Security Notice:</strong>
        Never share your banking credentials with anyone.
    </div>

    <footer>
        Same-Origin Policy Security Laboratory
    </footer>

</div>

</body>
</html>
